name: Build Sonic 4 Ep 1 (WanKerr)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Solution
      run: dotnet restore Sonic4Episode1.sln

    - name: Build Solution
      run: dotnet build Sonic4Episode1.sln --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4Episode1-Build
        path: |
          Sonic4Episode1.FNA/bin/Release/
          Sonic4Episode1/bin/Release/
