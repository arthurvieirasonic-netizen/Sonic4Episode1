name: Build Sonic 4 Ep 1 (WanKerr FNA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Fetch FNA Submodule
      run: |
        mkdir -p Submodules
        git clone --recursive https://github.com/FNA-XNA/FNA.git Submodules/FNA || true

    - name: Fix CSPROJ to Include Game Source Files
      run: |
        cd Sonic4Episode1.FNA
        
        # Cria um csproj inteligente que referencia o FNA e puxa todo o código do Sonic 4 automaticamente
        cat << 'EOF' > Sonic4Episode1.FNA.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0</TargetFramework>
            <OutputType>WinExe</OutputType>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
          </PropertyGroup>
          <ItemGroup>
            <ProjectReference Include="..\Submodules\FNA\FNA.Core.csproj" />
          </ItemGroup>
          <ItemGroup>
            <!-- Puxa todos os arquivos de código do jogo e do próprio projeto FNA -->
            <Compile Include="..\Sonic4Episode1\**\*.cs" />
            <Compile Include="**\*.cs" />
          </ItemGroup>
        </Project>
        EOF

    - name: Build FNA Project
      run: dotnet build Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4Episode1-FNA-Build
        path: Sonic4Episode1.FNA/bin/Release/
