name: Build Sonic 4 Ep 1 (WanKerr)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Fetch FNA Submodule
      run: |
        mkdir -p Submodules
        git clone --recursive https://github.com/FNA-XNA/FNA.git Submodules/FNA || true

    - name: Fix Linux Case Sensitivity (Symlink Force)
      run: |
        # Se a pasta 'appmain' existe, criamos um link 'AppMain' para ela (ou vice-versa)
        if [ -d "Sonic4Episode1/appmain" ]; then
          ln -sfn appmain Sonic4Episode1/AppMain
        elif [ -d "Sonic4Episode1/AppMain" ]; then
          ln -sfn AppMain Sonic4Episode1/appmain
        fi

    - name: Build FNA Project
      run: dotnet build Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4Episode1-FNA-Build
        path: Sonic4Episode1.FNA/bin/Release/
