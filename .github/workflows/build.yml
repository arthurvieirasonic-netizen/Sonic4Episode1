name: Build Sonic 4 Ep 1 (WanKerr FNA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Fetch FNA Submodule
      run: |
        mkdir -p Submodules
        git clone --recursive https://github.com/FNA-XNA/FNA.git Submodules/FNA || true

    - name: Rewrite CSPROJ to Auto-Include All Source Files
      run: |
        # Vamos injetar uma regra limpa no csproj para ele aceitar qualquer .cs recursivamente
        cd Sonic4Episode1.FNA
        
        # Cria um backup do csproj original
        cp Sonic4Episode1.FNA.csproj Sonic4Episode1.FNA.csproj.bak
        
        # Limpa referências antigas e insere a inclusão automática de arquivos C# de forma global
        cat << 'EOF' > patch.xml
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0</TargetFramework>
            <OutputType>WinExe</OutputType>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>true</EnableDefaultCompileItems>
          </PropertyGroup>
          <ItemGroup>
            <ProjectReference Include="..\Submodules\FNA\FNA.Core.csproj" />
          </ItemGroup>
        </Project>
        EOF
        
        # Substitui o csproj antigo pelo nosso limpo e automatizado
        mv patch.xml Sonic4Episode1.FNA.csproj

    - name: Build FNA Project
      run: dotnet build Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4Episode1-FNA-Build
        path: Sonic4Episode1.FNA/bin/Release/
