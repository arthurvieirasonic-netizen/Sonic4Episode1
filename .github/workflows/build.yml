name: Build Sonic 4 Ep 1 (WanKerr FNA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Fetch FNA Submodule
      run: |
        mkdir -p Submodules
        git clone --recursive https://github.com/FNA-XNA/FNA.git Submodules/FNA || true

    - name: Fix Project Paths and Case Sensitivity
      run: |
        # Entra na pasta do projeto FNA e corrige as referências internas do arquivo csproj
        cd Sonic4Episode1.FNA
        
        # Substitui barras invertidas do Windows (\) por barras normais (/)
        sed -i 's|\\|/|g' Sonic4Episode1.FNA.csproj
        
        # Garante que qualquer referência a 'appmain' aponte corretamente para o diretório existente
        sed -i 's|appmain/|appmain/|g' Sonic4Episode1.FNA.csproj

    - name: Build FNA Project
      run: dotnet build Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic4Episode1-FNA-Build
        path: Sonic4Episode1.FNA/bin/Release/
