name: Compilar Port Sonic 4 R36S
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar Codigo Bruto
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Instalar SDK do .NET Estável
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Corrigir Referências de Projetos Quebrados
      run: |
        # Remove fisicamente os links mortos dos submodulos que travavam o Git
        rm -rf Submodules/MonoGame
        
        # Cria um arquivo de projeto limpo focado apenas no executável
        sed -i '/<ProjectReference Include=".*MonoGame.*"/d' Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj
        
    - name: Compilar Executável Nativo Linux ARM64
      run: |
        # Compila ignorando os pacotes externos ausentes do repositório original
        dotnet build Sonic4Episode1.FNA/Sonic4Episode1.FNA.csproj -c Release -r linux-arm64 --self-contained true -p:DefineConstants="LINUX" -p:DisableImplicitFrameworkReferences=true -o ./output

    - name: Gerar o Pacote do Seu Port
      uses: actions/upload-artifact@v4
      with:
        name: meu-port-sonic4-r36s
        path: ./output/

