name: Compilar para R36S
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restaurar ferramentas
      run: dotnet restore
    - name: Publicar Executável ARM64
      run: |
        dotnet publish -f net8.0 -c Release -r linux-arm64 --self-contained true -o ./output
    - name: Enviar Arquivo Pronto
      uses: actions/upload-artifact@v4
      with:
        name: sonic4-r36s
        path: ./output/

